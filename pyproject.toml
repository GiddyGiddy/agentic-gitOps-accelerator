[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-gitops-agents"
version = "0.1.0"
description = "Policy-governed GitOps release coordination"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "alembic>=1.14,<2",
  "mcp>=1.30,<2",
  "openai>=2,<3",
  "azure-identity>=1.19,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
gitops-preflight = "app.agents.preflight_agent:main"
gitops-worker = "app.worker:main"
gitops-migrate = "app.storage.migrate:main"
gitops-mcp = "app.mcp.server:main"
gitops-gitlab-poller = "app.gitlab_poller:main"
gitops-traceability-backfill = "app.traceability:main"

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
