apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-http-redirect
  namespace: gitops-staging
spec:
  parentRefs:
    - name: gitops-console
      sectionName: harbor-http
  hostnames:
    - harbor.giddyitsolutions.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
