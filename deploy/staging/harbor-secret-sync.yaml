apiVersion: v1
kind: Namespace
metadata:
  name: harbor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-secret-sync
  namespace: harbor
  annotations:
    azure.workload.identity/client-id: "32167593-eff8-48bf-b331-e734f59b2442"
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: harbor-secrets
  namespace: harbor
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "32167593-eff8-48bf-b331-e734f59b2442"
    keyvaultName: kv-inventarmind-de4cc0
    tenantId: "fd58bbca-b54d-436b-a7bc-3cb0e2c1181a"
    objects: |
      array:
        - |
          objectName: harbor-staging-admin-password
          objectType: secret
        - |
          objectName: harbor-staging-encryption-key
          objectType: secret
        - |
          objectName: harbor-staging-core-auth
          objectType: secret
        - |
          objectName: harbor-staging-xsrf
          objectType: secret
        - |
          objectName: harbor-staging-token-key
          objectType: secret
        - |
          objectName: harbor-staging-token-cert
          objectType: secret
        - |
          objectName: harbor-staging-job-auth
          objectType: secret
        - |
          objectName: harbor-staging-registry-auth
          objectType: secret
        - |
          objectName: harbor-staging-registry-password
          objectType: secret
        - |
          objectName: harbor-staging-registry-htpasswd
          objectType: secret
        - |
          objectName: harbor-staging-database-password
          objectType: secret
  secretObjects:
    - secretName: harbor-admin
      type: Opaque
      data:
        - objectName: harbor-staging-admin-password
          key: HARBOR_ADMIN_PASSWORD
    - secretName: harbor-encryption
      type: Opaque
      data:
        - objectName: harbor-staging-encryption-key
          key: secretKey
    - secretName: harbor-core-auth
      type: Opaque
      data:
        - objectName: harbor-staging-core-auth
          key: secret
    - secretName: harbor-xsrf
      type: Opaque
      data:
        - objectName: harbor-staging-xsrf
          key: CSRF_KEY
    - secretName: harbor-token-signing
      type: Opaque
      data:
        - objectName: harbor-staging-token-key
          key: tls.key
        - objectName: harbor-staging-token-cert
          key: tls.crt
    - secretName: harbor-job-auth
      type: Opaque
      data:
        - objectName: harbor-staging-job-auth
          key: JOBSERVICE_SECRET
    - secretName: harbor-registry-auth
      type: Opaque
      data:
        - objectName: harbor-staging-registry-auth
          key: REGISTRY_HTTP_SECRET
    - secretName: harbor-registry-credentials
      type: Opaque
      data:
        - objectName: harbor-staging-registry-password
          key: REGISTRY_PASSWD
        - objectName: harbor-staging-registry-htpasswd
          key: REGISTRY_HTPASSWD
    - secretName: harbor-database-credentials
      type: Opaque
      data:
        - objectName: harbor-staging-database-password
          key: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-secret-sync
  namespace: harbor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-secret-sync
  template:
    metadata:
      labels:
        app: harbor-secret-sync
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: harbor-secret-sync
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: secrets
              mountPath: /mnt/harbor-secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: harbor-secrets
