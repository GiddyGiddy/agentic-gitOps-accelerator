apiVersion: v1
kind: Service
metadata:
  name: gitops-postgres
  namespace: gitops-staging
spec:
  type: ClusterIP
  selector:
    app: gitops-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitops-postgres
  namespace: gitops-staging
spec:
  serviceName: gitops-postgres
  replicas: 1
  selector:
    matchLabels:
      app: gitops-postgres
  template:
    metadata:
      labels:
        app: gitops-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: gitops
            - name: POSTGRES_USER
              value: gitops
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitops-postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gitops", "-d", "gitops"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 32Gi
