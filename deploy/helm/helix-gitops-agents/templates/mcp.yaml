{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-mcp
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: {{ include "helix-gitops-agents.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["gitops-mcp"]
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: {{ required "mcp.existingSecret is required" .Values.mcp.existingSecret }}
          env:
            - name: GITOPS_MCP_ALLOWED_HOSTS
              value: {{ required "mcp.allowedHosts is required" .Values.mcp.allowedHosts | quote }}
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8001
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-mcp
  ports:
    - port: 8001
      targetPort: 8001
{{- end }}
