{{- if .Values.uiKeyVault.enabled }}
{{- if hasKey .Values.env "GITOPS_UI_ENTRA_CLIENT_SECRET_FILE" }}
{{- fail "Do not set GITOPS_UI_ENTRA_CLIENT_SECRET_FILE in env when uiKeyVault is enabled" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "uiKeyVault.serviceAccountName is required" .Values.uiKeyVault.serviceAccountName | quote }}
  annotations:
    azure.workload.identity/client-id: {{ required "uiKeyVault.clientId is required" .Values.uiKeyVault.clientId | quote }}
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-ui-secret
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "uiKeyVault.clientId is required" .Values.uiKeyVault.clientId | quote }}
    keyvaultName: {{ required "uiKeyVault.vaultName is required" .Values.uiKeyVault.vaultName | quote }}
    tenantId: {{ required "uiKeyVault.tenantId is required" .Values.uiKeyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ required "uiKeyVault.secretName is required" .Values.uiKeyVault.secretName | quote }}
          objectAlias: client-secret
          objectType: secret
          objectVersion: ""
{{- end }}
