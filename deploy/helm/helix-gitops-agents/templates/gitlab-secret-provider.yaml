{{- if (.Values.gitlabKeyVault | default dict).enabled }}
{{- if not .Values.azureWorkloadIdentity.enabled }}
{{- fail "gitlabKeyVault requires azureWorkloadIdentity.enabled" }}
{{- end }}
{{- if hasKey .Values.env "GITOPS_GITLAB_TOKEN_FILE" }}
{{- fail "Do not set GITOPS_GITLAB_TOKEN_FILE in env when gitlabKeyVault is enabled" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-gitlab-token
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "azureWorkloadIdentity.clientId is required" .Values.azureWorkloadIdentity.clientId | quote }}
    keyvaultName: {{ required "gitlabKeyVault.vaultName is required" .Values.gitlabKeyVault.vaultName | quote }}
    tenantId: {{ required "gitlabKeyVault.tenantId is required" .Values.gitlabKeyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ required "gitlabKeyVault.secretName is required" .Values.gitlabKeyVault.secretName | quote }}
          objectAlias: gitlab-token
          objectType: secret
          objectVersion: ""
{{- end }}
