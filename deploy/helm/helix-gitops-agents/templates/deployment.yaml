apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agents
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-agents
        {{- if .Values.uiKeyVault.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ if .Values.uiKeyVault.enabled }}{{ .Values.uiKeyVault.serviceAccountName }}{{ else }}{{ .Values.serviceAccount.name }}{{ end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agents
          image: {{ include "helix-gitops-agents.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            {{- if .Values.argocdTLS.caConfigMap }}
            - name: GITOPS_ARGOCD_CA_CERT_FILE
              value: {{ printf "/mnt/argocd-ca/%s" .Values.argocdTLS.caKey | quote }}
            {{- end }}
            {{- if .Values.uiKeyVault.enabled }}
            - name: GITOPS_UI_ENTRA_CLIENT_SECRET_FILE
              value: /mnt/ui-secret/client-secret
            {{- end }}
            {{- if .Values.uiAllowedUsersSecret }}
            {{- if hasKey .Values.env "GITOPS_UI_ALLOWED_USERS" }}
            {{- fail "Set GITOPS_UI_ALLOWED_USERS in either env or uiAllowedUsersSecret, not both" }}
            {{- end }}
            - name: GITOPS_UI_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.uiAllowedUsersSecret | quote }}
                  key: GITOPS_UI_ALLOWED_USERS
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if or .Values.uiKeyVault.enabled .Values.argocdTLS.caConfigMap }}
          volumeMounts:
            {{- if .Values.argocdTLS.caConfigMap }}
            - name: argocd-ca
              mountPath: /mnt/argocd-ca
              readOnly: true
            {{- end }}
            {{- if .Values.uiKeyVault.enabled }}
            - name: ui-secret
              mountPath: /mnt/ui-secret
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.uiKeyVault.enabled .Values.argocdTLS.caConfigMap }}
      volumes:
        {{- if .Values.argocdTLS.caConfigMap }}
        - name: argocd-ca
          configMap:
            name: {{ .Values.argocdTLS.caConfigMap }}
            items:
              - key: {{ .Values.argocdTLS.caKey | quote }}
                path: {{ .Values.argocdTLS.caKey | quote }}
        {{- end }}
        {{- if .Values.uiKeyVault.enabled }}
        - name: ui-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-ui-secret
        {{- end }}
      {{- end }}
