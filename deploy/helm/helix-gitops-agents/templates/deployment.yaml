apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agents
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-agents
        {{- if .Values.uiKeyVault.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ if .Values.uiKeyVault.enabled }}{{ .Values.uiKeyVault.serviceAccountName }}{{ else }}{{ .Values.serviceAccount.name }}{{ end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agents
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            {{- if .Values.uiKeyVault.enabled }}
            - name: GITOPS_UI_ENTRA_CLIENT_SECRET_FILE
              value: /mnt/ui-secret/client-secret
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if .Values.uiKeyVault.enabled }}
          volumeMounts:
            - name: ui-secret
              mountPath: /mnt/ui-secret
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.uiKeyVault.enabled }}
      volumes:
        - name: ui-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-ui-secret
      {{- end }}
