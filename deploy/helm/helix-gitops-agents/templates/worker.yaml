apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
spec:
  replicas: {{ .Values.workerReplicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-worker
        {{- if .Values.azureWorkloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ include "helix-gitops-agents.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["gitops-worker"]
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            {{- if .Values.argocdTLS.caConfigMap }}
            - name: GITOPS_ARGOCD_CA_CERT_FILE
              value: {{ printf "/mnt/argocd-ca/%s" .Values.argocdTLS.caKey | quote }}
            {{- end }}
            {{- if (.Values.gitlabKeyVault | default dict).enabled }}
            - name: GITOPS_GITLAB_TOKEN_FILE
              value: /mnt/gitlab-token/gitlab-token
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if or (.Values.gitlabKeyVault | default dict).enabled .Values.argocdTLS.caConfigMap }}
          volumeMounts:
            {{- if .Values.argocdTLS.caConfigMap }}
            - name: argocd-ca
              mountPath: /mnt/argocd-ca
              readOnly: true
            {{- end }}
            {{- if (.Values.gitlabKeyVault | default dict).enabled }}
            - name: gitlab-token
              mountPath: /mnt/gitlab-token
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or (.Values.gitlabKeyVault | default dict).enabled .Values.argocdTLS.caConfigMap }}
      volumes:
        {{- if .Values.argocdTLS.caConfigMap }}
        - name: argocd-ca
          configMap:
            name: {{ .Values.argocdTLS.caConfigMap }}
            items:
              - key: {{ .Values.argocdTLS.caKey | quote }}
                path: {{ .Values.argocdTLS.caKey | quote }}
        {{- end }}
        {{- if (.Values.gitlabKeyVault | default dict).enabled }}
        - name: gitlab-token
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-gitlab-token
        {{- end }}
      {{- end }}
