{{- if .Values.harborKeyVault.enabled }}
{{- if not .Values.azureWorkloadIdentity.enabled }}
{{- fail "harborKeyVault requires azureWorkloadIdentity.enabled" }}
{{- end }}
{{- if or (hasKey .Values.env "GITOPS_HARBOR_URL") (hasKey .Values.env "GITOPS_HARBOR_USERNAME") (hasKey .Values.env "GITOPS_HARBOR_PASSWORD_FILE") }}
{{- fail "Do not set Harbor connection values in env when harborKeyVault is enabled" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-harbor-reader
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "azureWorkloadIdentity.clientId is required" .Values.azureWorkloadIdentity.clientId | quote }}
    keyvaultName: {{ required "harborKeyVault.vaultName is required" .Values.harborKeyVault.vaultName | quote }}
    tenantId: {{ required "harborKeyVault.tenantId is required" .Values.harborKeyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ required "harborKeyVault.secretName is required" .Values.harborKeyVault.secretName | quote }}
          objectAlias: password
          objectType: secret
          objectVersion: ""
{{- end }}
