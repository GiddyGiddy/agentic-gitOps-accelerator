apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  {{- if .Values.azureWorkloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "azureWorkloadIdentity.clientId is required" .Values.azureWorkloadIdentity.clientId | quote }}
  {{- end }}
automountServiceAccountToken: false
