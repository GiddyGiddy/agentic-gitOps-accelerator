workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

stages:
  - test
  - build
  - publish

test:
  image: python:3.12-slim
  stage: test
  script:
    - pip install ".[test]"
    - pytest -q

build:
  image:
    name: moby/buildkit:v0.20.2-rootless
    entrypoint: [""]
  stage: build
  variables:
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"
  script:
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --output "type=image,name=agentic-gitops-agents:$CI_COMMIT_SHA,push=false"
    - echo "Built image; configure registry login and an approved push policy before publishing."

publish_chart:
  stage: publish
  image:
    name: alpine/helm:3.17.3@sha256:d899e6316789fec04ee95300a18e454b7942539cbb3d89bde3e0655d6ca2e895
    entrypoint: [""]
  tags:
    - harbor-publisher
  environment:
    name: harbor-publish
  resource_group: harbor-chart-publish
  rules:
    - if: '$CHART_PUBLISH_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_DEBUG_TRACE != "true"'
    - when: never
  script:
    - sh scripts/publish-chart.sh
  artifacts:
    paths:
      - gitops-provenance.json

publish_image:
  stage: publish
  image:
    name: $IMAGE_PUBLISHER_TOOL_IMAGE
    entrypoint: [""]
  tags:
    - harbor-image-publisher
  environment:
    name: harbor-image-publish
  resource_group: harbor-image-publish
  timeout: 45m
  variables:
    GITHUB_REPOSITORY: GiddyGiddy/agentic-gitOps-accelerator
    HARBOR_HOST: harbor.giddyitsolutions.com
    HARBOR_IMAGE_REPOSITORY: charts/agentic-gitops-staging
  rules:
    - if: '$IMAGE_PUBLISH_ENABLED == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_DEBUG_TRACE != "true" && $IMAGE_PUBLISHER_TOOL_IMAGE =~ /^\S+@sha256:[a-f0-9]{64}$/'
    - when: never
  script:
    - python scripts/publish_image.py
  artifacts:
    paths:
      - image-provenance.json

