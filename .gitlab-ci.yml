stages:
  - test
  - build

test:
  image: python:3.12-slim
  stage: test
  script:
    - pip install ".[test]"
    - pytest -q

build:
  image: docker:27-cli
  stage: build
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - echo "Built image; configure registry login and an approved push policy before publishing."
