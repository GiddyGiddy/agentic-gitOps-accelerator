workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

stages:
  - test
  - build

test:
  image: python:3.12-slim
  stage: test
  script:
    - pip install ".[test]"
    - pytest -q

build:
  image:
    name: moby/buildkit:v0.20.2-rootless
    entrypoint: [""]
  stage: build
  variables:
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"
  script:
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --output "type=image,name=agentic-gitops-agents:$CI_COMMIT_SHA,push=false"
    - echo "Built image; configure registry login and an approved push policy before publishing."

